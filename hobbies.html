<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interessen von Boris Vareskovic – Fußball und Fitness.">
  <title>Interessen – Boris Vareskovic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #080c14;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-bright: rgba(255,255,255,0.15);
      --text: #f0f4ff;
      --muted: #7a8ba8;
      --blue: #4f8ef7;
      --blue-glow: rgba(79,142,247,0.35);
      --accent: #f0b429;
      --accent-glow: rgba(240,180,41,0.25);
      --radius: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── BACKGROUND ORBS ── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
    }
    .orb-1 { width: 600px; height: 600px; background: #2563eb; top: -150px; left: -100px; animation: drift 18s ease-in-out infinite alternate; }
    .orb-2 { width: 500px; height: 500px; background: #7c3aed; top: 40%; right: -120px; animation: drift 22s ease-in-out infinite alternate-reverse; }
    .orb-3 { width: 400px; height: 400px; background: #0891b2; bottom: 5%; left: 30%; animation: drift 15s ease-in-out infinite alternate; }

    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,30px) scale(1.1); }
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      height: 64px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8,12,20,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.05em;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    .nav-logo span { color: var(--blue); }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.87em;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }
    .nav-back:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border-bright);
    }

    @media (max-width: 500px) {
      nav { padding: 0 16px; }
    }

    /* ── PAGE CONTENT ── */
    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      padding: 100px 24px 80px;
    }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 48px;
    }

    .sec-num {
      font-family: 'Syne', sans-serif;
      font-size: 0.72em;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 2px;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .sec-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.85em;
      font-weight: 800;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .sec-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── HOBBY GRID ── */
    .hobby-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .hobby-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      text-align: center;
      backdrop-filter: blur(12px);
      transition: border-color 0.25s, background 0.25s, transform 0.25s, box-shadow 0.25s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .hobby-card:hover {
      border-color: var(--border-bright);
      background: var(--surface-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(79,142,247,0.1);
    }

    .hobby-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(79,142,247,0.1);
      border: 1px solid rgba(79,142,247,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8em;
      color: var(--blue);
      transition: background 0.25s, box-shadow 0.25s;
    }

    .hobby-card:hover .hobby-icon {
      background: rgba(79,142,247,0.18);
      box-shadow: 0 0 24px var(--blue-glow);
    }

    .hobby-card h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.25em;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .hobby-card p {
      font-size: 0.88em;
      color: var(--muted);
      max-width: 240px;
    }

    .hobby-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
      font-size: 0.84em;
      font-weight: 600;
      color: var(--blue);
      background: rgba(79,142,247,0.08);
      border: 1px solid rgba(79,142,247,0.2);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .hobby-link:hover {
      background: rgba(79,142,247,0.16);
      box-shadow: 0 0 16px var(--blue-glow);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 28px 20px;
      font-size: 0.83em;
      color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: none; margin: 0 6px; transition: color 0.2s; }
    footer a:hover { color: var(--text); }

    /* ── FADE IN ── */
    .fi { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .fi.in { opacity: 1; transform: none; }
  </style>

</head>

  <script>
    document.querySelectorAll('.fi').forEach((el, i) => {
      new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.style.transitionDelay = (i * 80) + 'ms';
            e.target.classList.add('in');
          }
        });
      }, { threshold: 0.1 }).observe(el);
    });
  </script>
